<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="header-container">
        <div class="logo">
          <img src="./img/GathSession..svg" alt="GathSession" />
        </div>
        <div class="navbar">
          <ul>
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">Features</a></li>
            <li><a href="#">Blog</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">About Us</a></li>
          </ul>
        </div>
      </div>
    </header>
    <main>
      <div class="hero-container">
        <div class="hero">
          <h1 class="hero__title">
            Build your best community starting from here.
          </h1>
          <p class="hero__description">
            Meet and communicate with the best people to run projects, events or
            other activities in a more effective and fun way
          </p>
          <a href="#" class="hero__button1">Get Started</a>
          <a href="#" class="hero__button2">Learn More</a>
          <div class="articles">
            <div class="community">
              <img
                src="./img/Community.svg"
                alt="Community"
                class="community__img"
              />
              <h2 class="community__title">Build Community</h2>
            </div>
            <div class="events">
              <img src="./img/Event.svg" alt="Events" class="events__img" />
              <h2 class="events__title">Share Events</h2>
            </div>
            <div class="information">
              <img
                src="./img/Information.svg"
                alt="information"
                class="information__img"
              />
              <h2 class="information__title">Get Information</h2>
            </div>
          </div>
        </div>
        <div class="crew">
          <img src="./img/content@2x.png" alt="Crew-Members" width="750px" />
        </div>
      </div>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
